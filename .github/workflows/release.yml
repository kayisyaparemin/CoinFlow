name: Stable release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version name for signing smoke test
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: mizan-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/CoinFlow.App/CoinFlow.App.csproj

jobs:
  release-apk:
    name: Test, sign, and release stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Stable tags must match vX.Y.Z; received: $GITHUB_REF_NAME" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
            release_tag="$GITHUB_REF_NAME"
          else
            version="${{ github.event.inputs.version }}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Smoke test version must match X.Y.Z; received: $version" >&2
              exit 1
            }
            release_tag="v$version"
          fi
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore CoinFlow.sln

      - name: Unit tests
        run: dotnet test tests/CoinFlow.Tests/CoinFlow.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"

      - name: Validate signing secrets and create temporary keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!variable:-}" ]] || { echo "Required signing secret is missing: $variable" >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/mizan-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [[ -s "$keystore" ]] || { echo "Decoded keystore is empty." >&2; exit 1; }
          chmod 600 "$keystore"
          echo "COINFLOW_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed stable APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          version_code="${{ steps.version.outputs.version_code }}"
          dotnet publish "$PROJECT" \
            -f net8.0-android \
            -c Release \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:CoinFlowDevBuild=false \
            -p:CoinFlowVersion="$version" \
            -p:CoinFlowBuildNumber="$version_code" \
            -p:CoinFlowCommit="${GITHUB_SHA::7}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$COINFLOW_KEYSTORE" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Locate, verify, and normalize signed APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t signed_apks < <(find src/CoinFlow.App/bin/Release/net8.0-android -type f -name '*-Signed.apk' -print)
          if [[ ${#signed_apks[@]} -eq 0 ]]; then
            echo "No signed APK was produced; refusing to create a release." >&2
            find src/CoinFlow.App/bin/Release/net8.0-android -type f -maxdepth 5 -print >&2
            exit 1
          fi
          apk="$(ls -1t "${signed_apks[@]}" | head -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$aapt" ]] || { echo "Android verification tools not found." >&2; exit 1; }
          "$apksigner" verify --verbose "$apk"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          if grep -q "CN=Android Debug" <<< "$certs"; then
            echo "Debug signing certificate detected; refusing stable artifact." >&2
            exit 1
          fi
          signing_sha256="$(sed -n "s/.*certificate SHA-256 digest: //p" <<< "$certs" | head -n 1)"
          [[ -n "$signing_sha256" ]] || { echo "Signing certificate SHA-256 was not found." >&2; exit 1; }
          badging="$("$aapt" dump badging "$apk")"
          package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          application_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
          [[ "$package_id" == "com.coinflow.mobile" ]] || { echo "Unexpected package id: $package_id" >&2; exit 1; }
          [[ "$version_code" == "${{ steps.version.outputs.version_code }}" ]] || { echo "Unexpected version code: $version_code" >&2; exit 1; }
          [[ "$version_name" == "${{ steps.version.outputs.version }}" ]] || { echo "Unexpected version name: $version_name" >&2; exit 1; }
          [[ "$application_label" == "Mizan" ]] || { echo "Unexpected application label: $application_label" >&2; exit 1; }
          mkdir -p artifacts
          output="artifacts/Mizan-${{ steps.version.outputs.version }}.apk"
          cp "$apk" "$output"
          unzip -t "$output" >/dev/null
          echo "artifact_path=$output" >> "$GITHUB_OUTPUT"
          echo "signing_sha256=$signing_sha256" >> "$GITHUB_OUTPUT"

      - name: Write stable release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          cat > release-notes.md <<NOTES
          # Mizan $version

          Mizan'ın ilk kararlı sürümü.

          Mizan, bugünkü finansal durumundan yola çıkarak önündeki maaş dönemlerini görmene ve finansal kararların etkisini simüle etmene yardımcı olur.

          ### İlk sürümde

          - Güncel finansal durum
          - 12 maaş dönemlik ileriye bakış
          - Kredi ve kredi kartı ödeme planları
          - Maaş kullanım düzeni
          - Tahmini faiz ve finansman açığı
          - Finansal karar simülatörü
          - Planı uygulama
          - Plan vs Gerçek dönem takibi
          - Finansal geçmiş
          - Ne zaman karşılayabilirim? hesabı
          NOTES

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mizan-signed-apk
          path: ${{ steps.apk.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create stable GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.release_tag }}" "${{ steps.apk.outputs.artifact_path }}" \
            --verify-tag \
            --title "Mizan ${{ steps.version.outputs.release_tag }}" \
            --notes-file release-notes.md

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${COINFLOW_KEYSTORE:-}" && -f "$COINFLOW_KEYSTORE" ]]; then
            rm -f -- "$COINFLOW_KEYSTORE"
          fi
